<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI OS - Starting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #100d20 0%, #1e1233 50%, #2b1847 100%);
            color: #f3e8ff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid #7c3aed;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .logo-container {
            position: relative;
            margin-bottom: 24px;
        }
        .logo-symbol {
            font-size: 56px;
            color: #c084fc;
            text-shadow: 0 0 25px rgba(192, 132, 252, 0.7);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }
        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .subtitle {
            font-size: 13px;
            color: #c4b5fd;
            letter-spacing: 1px;
            margin-bottom: 28px;
            opacity: 0.9;
        }
        .progress-track {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }
        .progress-bar {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
            border-radius: 3px;
            position: absolute;
            animation: slideProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .status-text {
            font-size: 12px;
            color: #b9a6d5;
            letter-spacing: 0.5px;
        }
        @keyframes slideProgress {
            0% { left: -35%; }
            100% { left: 100%; }
        }
        @keyframes pulseGlow {
            0% {
                transform: scale(0.96);
                text-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
            }
            100% {
                transform: scale(1.04);
                text-shadow: 0 0 35px rgba(192, 132, 252, 0.9);
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-symbol">✦</div>
    </div>
    <div class="title">NEXUS AI OS</div>
    <div class="subtitle">Autonomous AI Desktop Environment</div>
    <div class="progress-track">
        <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="statusMessage">Initializing Neural Engine & Database...</div>
</body>
</html>
